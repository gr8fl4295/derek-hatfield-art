<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — Derek Hatfield Art</title><meta name="description" content="Contact Derek Hatfield for commissioned artwork, concert posters, and other art inquiries.">
<style>
:root{color-scheme:dark;--bg:#111315;--surface:#1b1e21;--text:#f0eee9;--muted:#a1a5a8;--line:#303438}
*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font:15px/1.55 Arial,Helvetica,sans-serif;margin:0}a{color:inherit;text-decoration:none}.layout{max-width:1500px;margin:auto;padding:0 clamp(18px,4vw,55px)}header{border-bottom:1px solid var(--line);padding:26px 0;display:flex;justify-content:space-between;gap:20px;align-items:center}.logo{font-size:clamp(19px,2.1vw,26px);line-height:1.15;letter-spacing:.015em;font-weight:700;white-space:nowrap}.logo span{font-weight:400;color:var(--muted)}nav{display:flex;gap:25px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}nav a[aria-current="page"]{color:var(--text)}a:hover{text-decoration:underline;text-underline-offset:5px}main{max-width:790px;margin:0 auto;padding:clamp(58px,8vw,112px) 0 120px}h1{font:normal clamp(60px,9vw,105px)/1 Georgia,serif;letter-spacing:-.055em;margin:0 0 24px}p.lead{color:var(--muted);font-size:17px;line-height:1.7;max-width:610px;margin:0 0 46px}form{display:grid;gap:24px}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{display:flex;flex-direction:column;gap:9px}label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#d3d4d4}label span{color:var(--muted);text-transform:none;letter-spacing:0}input,textarea{width:100%;background:var(--surface);border:1px solid #454a4e;border-radius:3px;color:var(--text);font:inherit;padding:14px 15px}input::placeholder,textarea::placeholder{color:#80878c}textarea{min-height:190px;resize:vertical}input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #f0eee9;outline-offset:3px}button{font:700 13px Arial,sans-serif;cursor:pointer;color:var(--bg);background:var(--text);border:1px solid var(--text);padding:15px 29px;border-radius:3px;align-self:start}button:hover{background:#d1d0cb}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.status{font-size:13px;color:var(--muted)}.status.error{color:#f2b3a9}.status.success{color:#b9dec9}footer{border-top:1px solid var(--line);color:var(--muted);padding:30px 0 45px;font-size:12px}.honeypot{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}@media(max-width:650px){.two{grid-template-columns:1fr}nav{gap:14px}main{padding-top:64px}}
@media(max-width:540px){header{gap:12px}.logo{font-size:19px}nav{gap:12px;font-size:11px}}

/* V26: pill-shaped form submit button */
form button { border-radius:999px; }
</style></head><body><div class="layout"><header><a href="index.html" class="logo">DEREK HATFIELD <span>/ ART</span></a><nav><a href="index.html#archive">Archive</a><a href="contact.html" aria-current="page">Contact</a></nav></header>
<main><h1>Contact.</h1><p class="lead">For commissions, collaborations, print inquiries, or anything else, send a message below.</p>
<form id="contact-form" method="POST"><div class="two"><div class="field"><label for="name">Name *</label><input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" maxlength="140" required></div><div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="254" required></div></div>
<div class="field"><label for="phone">Phone number <span>(optional)</span></label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="(555) 123-4567" maxlength="40"></div>
<div class="field"><label for="message">Message *</label><textarea id="message" name="message" placeholder="Tell me a little about your project or inquiry…" maxlength="10000" required></textarea></div>
<div class="honeypot" aria-hidden="true"><label for="website">Leave this field empty</label><input id="website" name="_gotcha" type="text" tabindex="-1" autocomplete="off"></div>
<div class="actions"><button type="submit" id="submit">Send message</button><span class="status" id="status" role="status" aria-live="polite"></span></div></form>
</main><footer>Copyright © 2026 • All Rights Reserved • Derek Hatfield.</footer></div>
<script>
// Formspree endpoint for Derek Hatfield Art contact messages.
const FORM_ENDPOINT = 'https://formspree.io/f/xkjjpzng';
const form=document.getElementById('contact-form'), status=document.getElementById('status'), btn=document.getElementById('submit');
form.addEventListener('submit',async event=>{
  event.preventDefault();
  if(!form.reportValidity()) return;
  status.className='status';
  if(!/^https:\/\/formspree\.io\/f\/[A-Za-z0-9]+$/.test(FORM_ENDPOINT)){
    status.className='status error';status.textContent='Contact form is being set up. Please check back soon.';return;
  }
  btn.disabled=true; btn.textContent='Sending…'; status.textContent='';
  try{
    const response=await fetch(FORM_ENDPOINT,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}});
    if(!response.ok)throw new Error('Submission failed');
    status.className='status success';status.textContent='Thanks! Your message has been sent.';form.reset();
  }catch(error){status.className='status error';status.textContent='Message could not be sent. Please try again.';}
  finally{btn.disabled=false;btn.textContent='Send message';}
});
</script></body></html>
